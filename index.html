<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nour-Academy-Partie-3</title>
  </head>
  <body>
    <header class="w-full border-b border-slate-100 bg-white">
      <div
        class="flex h-16 bg-green-200 items-center justify-between px-4 sm:h-20 sm:px-6 lg:px-8"
      >
        <img
          src="/logo.png"
          alt="Nour Academy"
          class="h-11 w-11 object-contain sm:h-14 sm:w-14"
        />

        <div class="flex items-center gap-1 sm:gap-2">
          <button
            type="button"
            aria-label="Notifications"
            class="inline-flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
          >
            <i class="fa-solid fa-bell text-lg" aria-hidden="true"></i>
          </button>

          <button
            type="button"
            aria-label="User profile"
            class="inline-flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2"
          >
            <i class="fa-solid fa-user text-lg" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>
    <section
      class="relative mt-1.5 ml-[30px] w-[95%] shadow-md shadow-emerald-400 h-[300px] md:h-[350px] overflow-hidden rounded-[30px] my-6"
    >
      <img
        src="/hero.jpg"
        alt="Illustration éducative"
        class="absolute inset-0 w-full h-full object-cover"
      />

      <div
        class="relative z-10 flex h-full flex-col justify-center px-6 sm:px-10 md:px-14 gap-3"
      >
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-[#174A3A]">
          Bienvenue !👋
        </h1>

        <p class="max-w-xl text-base sm:text-lg text-[#65716A]">
          Votre espace de gestion pédagogique,
          <span class="font-semibold text-green-500">simple et efficace.</span>
        </p>
      </div>
    </section>
    <main>
      <section
        class="tableau mx-auto mt-8 w-[95%] rounded-2xl border border-[#E6F0E9] bg-white p-5 shadow-sm"
      >
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <div
              class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#E6F0E9] text-[#174A3A]"
            >
              <i class="fa-solid fa-users text-xl"></i>
            </div>

            <div>
              <h2 class="text-xl font-bold text-[#174A3A] sm:text-2xl">
                Faire l'appel
              </h2>
              <p class="mt-1 text-sm text-[#65716A]">
                Liste des étudiants du groupe
              </p>
            </div>
          </div>

          <div
            class="flex items-center gap-2 rounded-full bg-[#E6F0E9] px-4 py-2 text-sm font-semibold text-[#174A3A]"
          >
            <i class="fa-solid fa-user-group"></i>
            <span id="nombreEtudiants">15 élèves</span>
          </div>
        </div>
        <div
          class="contFilter mt-5 flex flex-col gap-3 rounded-2xl border border-[#E6F0E9] bg-[#FAF8F2] p-3 md:flex-row md:items-center"
        >
          <div
            class="flex min-w-0 items-center gap-2.5 rounded-xl border border-[#D6E8DC] bg-white px-3.5 transition-colors focus-within:border-[#174A3A] focus-within:ring-2 focus-within:ring-[#E6F0E9] h-12 md:flex-1"
          >
            <i class="fa-solid fa-magnifying-glass text-sm text-[#174A3A]"></i>
            <input
              class="h-full w-full min-w-0 bg-transparent text-sm text-[#1D2924] placeholder:text-[#8A9890] focus:outline-none"
              type="text"
              placeholder="Recherche un élève par prénom ou nom"
              id="recherche"
            />
          </div>

          <div
            class="flex items-center gap-2 rounded-xl border border-[#D6E8DC] bg-white px-3 transition-colors focus-within:border-[#174A3A] focus-within:ring-2 focus-within:ring-[#E6F0E9] md:w-44 h-12"
          >
            <i class="fa-solid fa-arrow-down-wide-short text-sm text-[#174A3A]"></i>
            <select
              id="triEtudiants"
              class="h-full w-full cursor-pointer bg-transparent text-sm text-[#1D2924] focus:outline-none"
              aria-label="Trier les étudiants"
            >
              <option value="">Aucun tri</option>
              <option value="nom">Nom</option>
              <option value="moyenne">Moyenne</option>
            </select>
          </div>

          <div
            class="flex items-center gap-2 rounded-xl border border-[#D6E8DC] bg-white px-3 transition-colors focus-within:border-[#174A3A] focus-within:ring-2 focus-within:ring-[#E6F0E9] md:w-52 h-12"
          >
            <i class="fa-solid fa-users text-sm text-[#174A3A]"></i>
            <select
              name="groupes"
              id="selectGroup"
              class="h-full w-full cursor-pointer bg-transparent text-sm text-[#1D2924] focus:outline-none"
              aria-label="Filtrer par groupe"
            >
              <option value="">Tous les groupes</option>
              <option value="1">2ème Bac</option>
              <option value="2">1ère Bac</option>
              <option value="3">Tronc Commun</option>
            </select>
          </div>
        </div>
          </div>
        </div>
    
<div class="mt-6 mb-5 flex justify-end">
  <button
    type="button"
    id="btnAjouterEleve"
    class=" w-full  inline-flex min-h-12 items-center justify-center gap-2 rounded-xl bg-[#174A3A] px-5 py-3 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-[#23634D] hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#174A3A] focus-visible:ring-offset-2 active:scale-[0.98]"
  >
    <i class="fa-solid fa-plus text-base"></i>
    Ajouter un élève
  </button>
</div>

<!-- formulair -->
<div
  id="formulaireContainer"
  class="fixed hidden inset-0 z-50  items-center justify-center bg-black/40 p-4"
>
  <div class="absolute left-1/2 top-1/2 w-[90%] max-w-lg -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-white p-6 shadow-xl">

    <div class="mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-bold text-[#174A3A]">
          Ajouter un élève
        </h2>
        <p class="mt-1 text-sm text-[#65716A]">
          Remplissez les informations du nouvel élève
        </p>
      </div>

      <button
        type="button"
        id="btnFermerForm"
        class="flex h-10 w-10 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <form id="formAjouterEleve" class="flex flex-col gap-4">

      <div>
        <label for="prenom" class="mb-1 block text-sm font-semibold text-[#1D2924]">
          Prénom
        </label>
        <input
          type="text"
          id="prenom"
          placeholder="Prénom de l'élève"
          class="w-full rounded-xl border border-[#D6E8DC] px-4 py-3 outline-none focus:border-[#174A3A] focus:ring-2 focus:ring-[#E6F0E9]"
        />
        <p id="erreurPrenom" class="mt-1 text-xs"></p>
      </div>

      <div>
        <label for="nom" class="mb-1 block text-sm font-semibold text-[#1D2924]">
          Nom
        </label>
        <input
          type="text"
          id="nom"
          placeholder="Nom de l'élève"
          class="w-full rounded-xl border border-[#D6E8DC] px-4 py-3 outline-none focus:border-[#174A3A] focus:ring-2 focus:ring-[#E6F0E9]"
        />
        <p id="erreurNom" class="mt-1 text-xs"></p>
      </div>

      <div>
        <label for="groupe" class="mb-1 block text-sm font-semibold text-[#1D2924]">
          Groupe
        </label>
        <select
          id="groupe"
          class="w-full rounded-xl border border-[#D6E8DC] bg-white px-4 py-3 outline-none focus:border-[#174A3A] focus:ring-2 focus:ring-[#E6F0E9]"
        >
          <option value="">Choisir un groupe</option>
          <option value="1">2ème Bac</option>
          <option value="2">1ère Bac</option>
          <option value="3">Tronc Commun</option>
        </select>
        <p id="erreurGroupe" class="mt-1 text-xs"></p>
      </div>

      <div>
        <label for="emailParent" class="mb-1 block text-sm font-semibold text-[#1D2924]">
          Email du parent
        </label>
        <input
          type="email"
          id="emailParent"
          placeholder="exemple@email.com"
          class="w-full rounded-xl border border-[#D6E8DC] px-4 py-3 outline-none focus:border-[#174A3A] focus:ring-2 focus:ring-[#E6F0E9]"
        />
        <p id="erreurEmail" class="mt-1 text-xs"></p>
      </div>

      <div>
        <label for="telephoneParent" class="mb-1 block text-sm font-semibold text-[#1D2924]">
          Téléphone du parent
        </label>
        <input
          type="tel"
          id="telephoneParent"
          placeholder="06XXXXXXXX"
          class="w-full rounded-xl border border-[#D6E8DC] px-4 py-3 outline-none focus:border-[#174A3A] focus:ring-2 focus:ring-[#E6F0E9]"
        />
        <p id="erreurTelephone" class="mt-1 text-xs"></p>
      </div>

      <div>
       
      </div>

      <button
        type="submit"
          id="btnSend"
        class="mt-2 min-h-12 w-full rounded-xl bg-[#174A3A] px-5 py-3 font-semibold text-white transition-colors hover:bg-[#23634D] "
      >
        Ajouter l'élève
      </button>

    </form>
  </div>
</div>



        <div id="container">
<!-- remplie par function js -->
        </div>

      </section>
      <aside></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
